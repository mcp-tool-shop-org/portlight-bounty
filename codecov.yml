# Patch coverage is the bar. A pull request fails when the lines it changed
# are under 90% covered. Codecov counts a line whose branches did not all
# run as partial, and a partial line is not covered. The repository-wide
# percentage aims at the same 90% and stays informational. portlight-godot
# is not in this report. The chart job builds that crate.
coverage:
  range: "90...100"
  status:
    project:
      default:
        target: 90%
        informational: true
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  hide_project_coverage: true
  require_changes: false
