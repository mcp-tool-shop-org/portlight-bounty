# Project and patch coverage both enforce a 90% bar. Codecov counts a line
# whose branches did not all run as partial, and a partial line is not
# covered. portlight-godot is not in this report. The chart job builds that
# crate.
coverage:
  range: "70...90"
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  hide_project_coverage: false
  require_changes: false
