[package]
name = "portlight-sim"
description = "Deterministic Portlight rules and simulation core (no UI)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# serde_json's preserve_order feature accepts indexmap 2.2.3+, and 2.14 needs
# Rust 1.85. The toolchain is 1.98.1. Keep =2.11.4 (the last release that also
# built on 1.83) so Cargo.lock does not move.
indexmap = "=2.11.4"
sha2 = "0.10"
