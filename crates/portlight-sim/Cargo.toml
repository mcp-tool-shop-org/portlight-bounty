[package]
name = "portlight-sim"
description = "Deterministic Portlight rules and simulation core (no UI)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# serde_json's preserve_order feature accepts indexmap 2.2.3+, and 2.14 needs
# Rust 1.85. This crate stays on 1.83, so pin the last 1.83-compatible release.
indexmap = "=2.11.4"
sha2 = "0.10"
