name: CI

# On 2026-10-05, while the repo was private, a bare `push:` + `pull_request:`
# with no concurrency used 1,500 Actions minutes in one day: every PR commit
# ran the full suite twice (once per event), and 12 pushes to one branch in
# two minutes each ran to the end. The org's included private quota is
# 2,000 minutes a month. The triggers below are the guard; keep them.
#
# - push runs only on main. A feature branch is covered by its PR.
# - Docs-only changes do not run CI. Nothing here reads docs/ or *.md.
#   No check is required on main today. If one is made required, drop
#   paths-ignore from pull_request, or a docs-only PR can never merge.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# A newer commit on the same PR or on main cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        # portlight-godot is built and tested in the godot job below.
        run: cargo clippy --locked --workspace --exclude portlight-godot --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --exclude portlight-godot
      - name: Manifest gate fixtures
        run: python3 -m pip install --target /tmp/portlight-pytest 'pytest==9.1.1' && PYTHONPATH=/tmp/portlight-pytest python3 tools/test_build_manifest_gates.py
      - name: Parity allowlist
        run: python3 tools/parity/test_check.py

  # The Python game is public, so CI can check the live oracle out at the
  # source commit. Goldens alone still run in the test job.
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mcp-tool-shop-org/portlight
          ref: 9b02494cca9cd8f58c4531c41f75be02c9720e43
          path: vendor/portlight
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: cargo build --locked -p portlight-cli
      - name: Live Python oracle
        run: PYTHONPATH=${{ github.workspace }}/vendor/portlight/src python3 tools/parity/check.py --require-oracle
      - name: Parity allowlist and golden bytes
        run: PYTHONPATH=${{ github.workspace }}/vendor/portlight/src python3 tools/parity/test_check.py
      - name: Victory fixtures
        run: PYTHONPATH=${{ github.workspace }}/vendor/portlight/src python3 tools/parity/victory_cases.py --check
      - name: Roster and custom-captain options
        run: PYTHONPATH=${{ github.workspace }}/vendor/portlight/src python3 tools/parity/roster_options.py --check
      - name: Save-slot listing
        run: PYTHONPATH=${{ github.workspace }}/vendor/portlight/src python3 tools/parity/save_slots.py --check
      - name: Custom-captain save
        run: PYTHONPATH=${{ github.workspace }}/vendor/portlight/src python3 tools/parity/custom_captain_save.py --check

  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (portlight-godot)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo clippy --locked -p portlight-godot --all-targets -- -D warnings
      - name: Build the GDExtension
        # rust-toolchain.toml pins 1.98.1, which can build godot-bindings 0.5.5
        # (edition 2024). RUSTUP_TOOLCHAIN wins over the toolchain file, so this
        # job builds with the stable toolchain installed above.
        # This job stays required: Godot 4.7.2 runs headless here. Do not skip it.
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          rustc --version
          cargo test --locked -p portlight-godot
          cargo build --locked -p portlight-godot
      - name: Install Godot 4.7.2
        # The official Linux binary dlopens X11, GL, and fontconfig even for
        # --headless. ubuntu-latest usually has them; install them so a thinner
        # image does not fail the smoke after the extension builds.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libxext6 \
            libgl1 libfontconfig1
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 755 /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import and smoke-test the chart
        # Headless Godot's dummy renderer cannot draw. It must not be asked for
        # a viewport image: that logs `Parameter "t" is null` and
        # `viewport image was empty` and used to exit 0. The session smoke
        # stays headless and does not capture. The frame is Xvfb + OpenGL.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
          reject_renderer_errors() {
            local log="$1"
            if grep -nE 'Parameter "t" is null|viewport image was empty|servers/rendering/' "$log"; then
              echo "Godot log ${log} contains a renderer error or an empty viewport image."
              exit 1
            fi
          }
          run_godot() {
            local log="$1"
            shift
            set +e
            "$@" >"$log" 2>&1
            local code=$?
            cat "$log"
            set -e
            reject_renderer_errors "$log"
            if [ "$code" -ne 0 ]; then
              echo "Godot exited ${code}"
              exit "$code"
            fi
          }
          run_godot /tmp/godot-import.log \
            godot --headless --path godot --import --quit
          run_godot /tmp/godot-headless-smoke.log \
            godot --headless --path godot -- --smoke
          # An explicit shot on headless cannot be drawn. Main exits 1 and
          # writes no file. The plain smoke above stays exit 0. This log
          # contains the dummy-renderer error, so it is not run_godot.
          expect_explicit_headless_shot_fails() {
            local log="$1"
            shift
            set +e
            "$@" >"$log" 2>&1
            local code=$?
            set -e
            cat "$log"
            if [ "$code" -ne 1 ]; then
              echo "explicit headless capture exited ${code}, expected 1"
              exit 1
            fi
            if grep -q 'portlight smoke ok' "$log" || grep -q 'portlight encounter smoke ok' "$log" || grep -q 'portlight newgame smoke ok' "$log" || grep -q 'portlight contracts smoke ok' "$log" || grep -q 'portlight shipyard smoke ok' "$log" || grep -q 'portlight journal smoke ok' "$log" || grep -q 'portlight harbour smoke ok' "$log" || grep -q 'portlight crew smoke ok' "$log" || grep -q 'portlight hunt smoke ok' "$log" || grep -q 'portlight day-report smoke ok' "$log" || grep -q 'portlight trade smoke ok' "$log"; then
              echo "explicit headless capture printed smoke ok"
              exit 1
            fi
            if ! grep -q 'FAILED' "$log"; then
              echo "explicit headless capture did not print FAILED"
              exit 1
            fi
          }
          rm -f /tmp/hs.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs.png \
            godot --headless --path godot -- --smoke
          if [ -f /tmp/hs.png ]; then
            echo "headless PORTLIGHT_SHOT wrote /tmp/hs.png"
            exit 1
          fi
          rm -f /tmp/hs-encounter.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-encounter-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs-encounter.png \
            godot --headless --path godot -- --encounter-screen
          if [ -f /tmp/hs-encounter.png ]; then
            echo "headless encounter PORTLIGHT_SHOT wrote a file"
            exit 1
          fi
          rm -f /tmp/hs-galleon.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-galleon-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs-galleon.png \
            godot --headless --path godot -- --encounter-galleon
          if [ -f /tmp/hs-galleon.png ]; then
            echo "headless galleon PORTLIGHT_SHOT wrote a file"
            exit 1
          fi
          # --art-docs and PORTLIGHT_ART_DOCS request a capture. Headless
          # must fail them. Only the implicit /tmp default is skipped.
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-galleon.log \
            godot --headless --path godot -- --art-docs --encounter-galleon
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-env.log \
            env PORTLIGHT_ART_DOCS=1 \
            godot --headless --path godot -- --encounter-galleon
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-screen.log \
            godot --headless --path godot -- --art-docs --encounter-screen
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-art.log \
            godot --headless --path godot -- --art-docs --art
          run_godot /tmp/godot-encounter-smoke.log \
            godot --headless --path godot -- --encounter-screen
          if ! grep -q 'portlight encounter smoke ok' /tmp/godot-encounter-smoke.log; then
            echo "encounter smoke did not report ok"
            exit 1
          fi
          rm -f /tmp/hs-newgame.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-newgame-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs-newgame.png \
            godot --headless --path godot -- --newgame-screen
          if [ -f /tmp/hs-newgame.png ]; then
            echo "headless newgame PORTLIGHT_SHOT wrote a file"
            exit 1
          fi
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-newgame.log \
            godot --headless --path godot -- --art-docs --newgame-screen
          run_godot /tmp/godot-newgame-smoke.log \
            godot --headless --path godot -- --newgame-screen
          if ! grep -q 'portlight newgame smoke ok' /tmp/godot-newgame-smoke.log; then
            echo "newgame smoke did not report ok"
            exit 1
          fi
          rm -f /tmp/hs-contracts.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-contracts-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs-contracts.png \
            godot --headless --path godot -- --contracts-screen
          if [ -f /tmp/hs-contracts.png ]; then
            echo "headless contracts PORTLIGHT_SHOT wrote a file"
            exit 1
          fi
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-contracts.log \
            godot --headless --path godot -- --art-docs --contracts-screen
          run_godot /tmp/godot-contracts-smoke.log \
            godot --headless --path godot -- --contracts-screen
          if ! grep -q 'portlight contracts smoke ok' /tmp/godot-contracts-smoke.log; then
            echo "contracts smoke did not report ok"
            exit 1
          fi
          rm -f /tmp/hs-shipyard.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-shipyard-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs-shipyard.png \
            godot --headless --path godot -- --shipyard-screen
          if [ -f /tmp/hs-shipyard.png ]; then
            echo "headless shipyard PORTLIGHT_SHOT wrote a file"
            exit 1
          fi
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-shipyard.log \
            godot --headless --path godot -- --art-docs --shipyard-screen
          run_godot /tmp/godot-shipyard-smoke.log \
            godot --headless --path godot -- --shipyard-screen
          if ! grep -q 'portlight shipyard smoke ok' /tmp/godot-shipyard-smoke.log; then
            echo "shipyard smoke did not report ok"
            exit 1
          fi
          rm -f /tmp/hs-journal.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-journal-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs-journal.png \
            godot --headless --path godot -- --journal-screen
          if [ -f /tmp/hs-journal.png ]; then
            echo "headless journal PORTLIGHT_SHOT wrote a file"
            exit 1
          fi
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-journal.log \
            godot --headless --path godot -- --art-docs --journal-screen
          run_godot /tmp/godot-journal-smoke.log \
            godot --headless --path godot -- --journal-screen
          if ! grep -q 'portlight journal smoke ok' /tmp/godot-journal-smoke.log; then
            echo "journal smoke did not report ok"
            exit 1
          fi
          rm -f /tmp/hs-harbour.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-harbour-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs-harbour.png \
            godot --headless --path godot -- --harbour-screen
          if [ -f /tmp/hs-harbour.png ]; then
            echo "headless harbour PORTLIGHT_SHOT wrote a file"
            exit 1
          fi
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-harbour.log \
            godot --headless --path godot -- --art-docs --harbour-screen
          run_godot /tmp/godot-harbour-smoke.log \
            godot --headless --path godot -- --harbour-screen
          if ! grep -q 'portlight harbour smoke ok' /tmp/godot-harbour-smoke.log; then
            echo "harbour smoke did not report ok"
            exit 1
          fi
          rm -f /tmp/hs-crew.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-crew-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs-crew.png \
            godot --headless --path godot -- --crew-screen
          if [ -f /tmp/hs-crew.png ]; then
            echo "headless crew PORTLIGHT_SHOT wrote a file"
            exit 1
          fi
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-crew.log \
            godot --headless --path godot -- --art-docs --crew-screen
          run_godot /tmp/godot-crew-smoke.log \
            godot --headless --path godot -- --crew-screen
          if ! grep -q 'portlight crew smoke ok' /tmp/godot-crew-smoke.log; then
            echo "crew smoke did not report ok"
            exit 1
          fi
          rm -f /tmp/hs-hunt.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-hunt-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs-hunt.png \
            godot --headless --path godot -- --hunt-screen
          if [ -f /tmp/hs-hunt.png ]; then
            echo "headless hunt PORTLIGHT_SHOT wrote a file"
            exit 1
          fi
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-hunt.log \
            godot --headless --path godot -- --art-docs --hunt-screen
          run_godot /tmp/godot-hunt-smoke.log \
            godot --headless --path godot -- --hunt-screen
          if ! grep -q 'portlight hunt smoke ok' /tmp/godot-hunt-smoke.log; then
            echo "hunt smoke did not report ok"
            exit 1
          fi
          rm -f /tmp/hs-loss-outcome.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-loss-outcome-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs-loss-outcome.png \
            godot --headless --path godot -- --encounter-loss-outcome
          if [ -f /tmp/hs-loss-outcome.png ]; then
            echo "headless loss-outcome PORTLIGHT_SHOT wrote a file"
            exit 1
          fi
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-loss-outcome.log \
            godot --headless --path godot -- --art-docs --encounter-loss-outcome
          run_godot /tmp/godot-loss-outcome-smoke.log \
            godot --headless --path godot -- --encounter-loss-outcome
          if ! grep -q 'portlight loss-outcome smoke ok' /tmp/godot-loss-outcome-smoke.log; then
            echo "loss-outcome smoke did not report ok"
            exit 1
          fi
          rm -f /tmp/hs-day-report.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-day-report-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs-day-report.png \
            godot --headless --path godot -- --day-report-screen
          if [ -f /tmp/hs-day-report.png ]; then
            echo "headless day-report PORTLIGHT_SHOT wrote a file"
            exit 1
          fi
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-day-report.log \
            godot --headless --path godot -- --art-docs --day-report-screen
          run_godot /tmp/godot-day-report-smoke.log \
            godot --headless --path godot -- --day-report-screen
          if ! grep -q 'portlight day-report smoke ok' /tmp/godot-day-report-smoke.log; then
            echo "day-report smoke did not report ok"
            exit 1
          fi
          rm -f /tmp/hs-day-report-week.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-day-report-week-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs-day-report-week.png \
            godot --headless --path godot -- --day-report-week
          if [ -f /tmp/hs-day-report-week.png ]; then
            echo "headless day-report-week PORTLIGHT_SHOT wrote a file"
            exit 1
          fi
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-day-report-week.log \
            godot --headless --path godot -- --art-docs --day-report-week
          run_godot /tmp/godot-day-report-week-smoke.log \
            godot --headless --path godot -- --day-report-week
          if ! grep -q 'portlight day-report smoke ok' /tmp/godot-day-report-week-smoke.log; then
            echo "day-report-week smoke did not report ok"
            exit 1
          fi
          rm -f /tmp/hs-day-report-arrival.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-day-report-arrival-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs-day-report-arrival.png \
            godot --headless --path godot -- --day-report-arrival
          if [ -f /tmp/hs-day-report-arrival.png ]; then
            echo "headless day-report-arrival PORTLIGHT_SHOT wrote a file"
            exit 1
          fi
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-day-report-arrival.log \
            godot --headless --path godot -- --art-docs --day-report-arrival
          run_godot /tmp/godot-day-report-arrival-smoke.log \
            godot --headless --path godot -- --day-report-arrival
          if ! grep -q 'portlight day-report smoke ok' /tmp/godot-day-report-arrival-smoke.log; then
            echo "day-report-arrival smoke did not report ok"
            exit 1
          fi
          # Contract fail: real seed-1 expiry (Session verbs), then the frame.
          rm -f /tmp/hs-day-report-expired.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-day-report-expired-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs-day-report-expired.png \
            godot --headless --path godot -- --day-report-expired
          if [ -f /tmp/hs-day-report-expired.png ]; then
            echo "headless day-report-expired PORTLIGHT_SHOT wrote a file"
            exit 1
          fi
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-day-report-expired.log \
            godot --headless --path godot -- --art-docs --day-report-expired
          run_godot /tmp/godot-day-report-expired-smoke.log \
            godot --headless --path godot -- --day-report-expired
          if ! grep -q 'portlight day-report smoke ok' /tmp/godot-day-report-expired-smoke.log; then
            echo "day-report-expired smoke did not report ok"
            exit 1
          fi
          rm -f /tmp/hs-contract-strip.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-contract-strip-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs-contract-strip.png \
            godot --headless --path godot -- --contract-strip-screen
          if [ -f /tmp/hs-contract-strip.png ]; then
            echo "headless contract-strip PORTLIGHT_SHOT wrote a file"
            exit 1
          fi
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-contract-strip.log \
            godot --headless --path godot -- --art-docs --contract-strip-screen
          run_godot /tmp/godot-contract-strip-smoke.log \
            godot --headless --path godot -- --contract-strip-screen
          if ! grep -q 'portlight contract-strip smoke ok' /tmp/godot-contract-strip-smoke.log; then
            echo "contract-strip smoke did not report ok"
            exit 1
          fi
          # T-Q / T-N: Qty 10 buy, sail, Qty 10 sell that settles a contract.
          run_godot /tmp/godot-trade-smoke.log \
            godot --headless --path godot -- --trade-smoke
          if ! grep -q 'portlight trade smoke ok' /tmp/godot-trade-smoke.log; then
            echo "trade smoke did not report ok"
            exit 1
          fi
          # T-N frames: the same settle, then a staged two-line + more notice.
          rm -f /tmp/hs-market-paid.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-market-paid-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs-market-paid.png \
            godot --headless --path godot -- --market-paid-screen
          if [ -f /tmp/hs-market-paid.png ]; then
            echo "headless market-paid PORTLIGHT_SHOT wrote a file"
            exit 1
          fi
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-market-paid.log \
            godot --headless --path godot -- --art-docs --market-paid-screen
          run_godot /tmp/godot-market-paid-smoke.log \
            godot --headless --path godot -- --market-paid-screen
          if ! grep -q 'portlight trade smoke ok' /tmp/godot-market-paid-smoke.log; then
            echo "market-paid smoke did not report ok"
            exit 1
          fi
          # Departure check: F9 crew line, clean sail, late panel, Escape /
          # Stay keep port, Sail anyway departs. Real Session verbs only.
          rm -f /tmp/hs-departure-check.png
          expect_explicit_headless_shot_fails /tmp/godot-headless-departure-check-shot.log \
            env PORTLIGHT_SHOT=/tmp/hs-departure-check.png \
            godot --headless --path godot -- --departure-check-screen
          if [ -f /tmp/hs-departure-check.png ]; then
            echo "headless departure-check PORTLIGHT_SHOT wrote a file"
            exit 1
          fi
          expect_explicit_headless_shot_fails /tmp/godot-headless-art-docs-departure-check.log \
            godot --headless --path godot -- --art-docs --departure-check-screen
          run_godot /tmp/godot-departure-check-smoke.log \
            godot --headless --path godot -- --departure-check-screen
          if ! grep -q 'portlight departure-check smoke ok' /tmp/godot-departure-check-smoke.log; then
            echo "departure-check smoke did not report ok"
            exit 1
          fi
          run_godot /tmp/godot-gl-smoke.log \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            env PORTLIGHT_SMOKE=1 PORTLIGHT_SHOT=/tmp/portlight-chart-1280.png \
            godot --display-driver x11 --rendering-driver opengl3 --path godot -- --smoke
          # Filename is not encounter-*.png. The capture mode still has to
          # accept the ink ground. A flat rejection exits non-zero.
          run_godot /tmp/godot-galleon.log \
            xvfb-run -a -s "-screen 0 1280x720x24" \
